name: Deploy oxView to GitHub Pages

# Runs on every push to `recovered` (this repo's active branch -- the
# registered GitHub "default branch" is a stale `master`) and can also be
# triggered manually. Rebuilds the TypeScript output and the rigidDNA WASM
# modules from scratch every time, so neither Emscripten nor a local
# rigidDNA checkout is ever required on a developer's machine just to keep
# the deployed site current -- only when actively working on that C++
# source itself.
#
# The rigidDNA C++ source is vendored into wasm/rigiddna-src/ (see the
# README there) rather than checked out from its own repo at build time,
# because that repo is private and the default GITHUB_TOKEN for *this*
# repo has no access to it.

on:
  push:
    branches:
      - recovered
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oxdna-viewer
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (dist/)
        # A handful of pre-existing type errors elsewhere in this codebase
        # (unrelated to this workflow) make tsc exit non-zero even though it
        # still emits every file with no errors of its own -- `|| true` here
        # matches how this project has always been built locally.
        run: npx tsc || true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build rigidDNA WASM modules
        run: |
          set -e
          EMCC_FLAGS="-std=c++17 -O3 -s MODULARIZE=1 -s EXPORTED_RUNTIME_METHODS=[\"callMain\",\"FS\"] -s INVOKE_RUN=0 -s EXIT_RUNTIME=1 -s ALLOW_MEMORY_GROWTH=1 -s ENVIRONMENT=web,worker -s FILESYSTEM=1"

          em++ $EMCC_FLAGS -s EXPORT_NAME=createRigidBodySimModule \
            wasm/rigiddna-src/rigid_body_sim/RigidBodySim.cpp \
            -o wasm/rigid_body_sim.js

          em++ $EMCC_FLAGS -s EXPORT_NAME=createHelixClusterModule \
            wasm/rigiddna-src/helix_cluster/HelixCluster.cpp \
            -o wasm/helix_cluster.js

      - name: Verify WASM build output
        run: |
          test -s wasm/rigid_body_sim.wasm
          test -s wasm/helix_cluster.wasm
          echo "WASM modules built OK:"
          ls -la wasm/

      - name: Stage deployable site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            --exclude='_site' \
            ./ _site/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          commit-message: "Deploy oxView — ${{ github.sha }}"
